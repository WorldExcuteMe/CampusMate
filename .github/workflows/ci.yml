name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run check:function
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CAMPUSMATE_E2E_OUTPUT: ${{ runner.temp }}/campusmate-e2e-demo
      - name: Install runtime integration dependencies
        run: npm --prefix ../backend ci
      - name: Runtime browser integration (scripted model, no remote credentials)
        run: npx playwright test -c playwright.integration.config.ts
        env:
          CAMPUSMATE_E2E_OUTPUT: ${{ runner.temp }}/campusmate-e2e-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-fixture-evidence
          path: |
            ${{ runner.temp }}/campusmate-e2e-demo
            ${{ runner.temp }}/campusmate-e2e-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: web/dist

  backend:
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Backend Type Check
        run: npm run typecheck
      - name: Install document renderer Chromium
        run: npx playwright install --with-deps chromium
      - name: Backend Tests (unit/integration/security/recovery)
        run: npm test -- --test-concurrency=1
      - name: Migration Validation (PGlite real engine)
        run: node scripts/validate-migration.ts
      - name: Benchmark Smoke (30 tasks)
        run: node scripts/run-benchmark.ts
